                  minLength: 1
                type:
                  type: string
                  enum:
                    - ANNUAL
                    - SICK
                    - EMERGENCY
                    - UNPAID
                startDate:
                  type: string
                endDate:
                  type: string
                duration:
                  type: integer
                status:
                  type: string
                  enum:
                    - PENDING
                    - MANAGER_APPROVED
                    - HR_APPROVED
                    - REJECTED
                    - CANCELLED
                nextStep:
                  anyOf:
                    - type: string
                    - type: 'null'
              required:
                - id
                - type
                - startDate
                - endDate
                - duration
                - status
                - nextStep
            - type: 'null'
        latestSalary:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  minLength: 1
                periodLabel:
                  type: string
                totalNet:
                  type: integer
                isPaid:
                  type: boolean
              required:
                - id
                - periodLabel
                - totalNet
                - isPaid
            - type: 'null'
      required:
