components:
  responses:
    Healthy:
      description: Probe succeeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          const: ok
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        requestId:
          type: string
        detail:
          type: string
    SessionUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        email:
          type: string
        name:
          anyOf:
            - type: string
            - type: 'null'
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - HR
            - MANAGER
            - EMPLOYEE
        employeeId:
          anyOf:
            - type: string
            - type: 'null'
        image:
          anyOf:
            - type: string
            - type: 'null'
        isProfileComplete:
          type: boolean
        mustChangePassword:
          type: boolean
      required:
        - id
        - email
        - name
        - role
        - employeeId
        - image
        - isProfileComplete
        - mustChangePassword
    Session:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        expires:
          type: string
          format: date-time
      required:
        - user
        - expires
    Login:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    EmailInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
      required:
        - email
    TokenInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - token
    PasswordReset:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
      required:
        - token
        - newPassword
    PasswordChange:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
        confirmPassword:
          type: string
          format: password
      required:
        - currentPassword
        - newPassword
        - confirmPassword
    AccountInfo:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        state:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
            - MUST_CHANGE_PASSWORD
        lockedUntil:
          anyOf:
            - type: string
            - type: 'null'
      required:
        - userId
        - state
        - lockedUntil
    SystemUser:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
        state:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
            - LOCKED
            - MUST_CHANGE_PASSWORD
        lockedUntil:
          anyOf:
            - type: string
            - type: 'null'
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - HR
            - MANAGER
            - EMPLOYEE
        employeeId:
          anyOf:
            - type: string
            - type: 'null'
        isSelf:
          type: boolean
      required:
        - userId
        - state
        - lockedUntil
        - name
        - email
        - role
        - employeeId
        - isSelf
    Option:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    OrganizationOptions:
      type: object
      additionalProperties: false
      properties:
        departments:
          type: array
