openapi: 3.1.0
info:
  title: Employee Management System API
  version: 0.5.0
  description: >-
    Employee Management System REST API for identity, HR master data, attendance, leave, audit, payroll, dashboards
    and reports. CSV downloads use the same data and authorization as the corresponding views.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check that the HTTP process is alive
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
  /readyz:
    get:
      operationId: getReadiness
      summary: Check PostgreSQL connectivity and applied Goose migrations
      responses:
        '200':
          $ref: '#/components/responses/Healthy'
        '503':
          description: PostgreSQL is unavailable or a required Goose migration is pending
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Get this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  success:
                    const: true
                  message:
                    type: string
                  data:
                    type: 'null'
                required:
                  - success
                  - message
                  - data
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - name: Origin
          in: header
          required: true
          schema:
            type: string
          description: Must match APP_ORIGIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
